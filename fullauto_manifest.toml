# Full Auto (Xbox 360) - ReXGlue project manifest
#
# Title ID 534507D5, media ID 1D5F3880, XEX version 4 (Games on Demand copy, no title update
# applied). The XEX is not in this repository: build.bat puts your own copy in game/.
#
# Codegen reads this file during every build. If a build stops with "Validation failed", the
# log lists the addresses to add under [entrypoint.functions] (see docs/GAME_NOTES.md).

[project]
sdk_version = "0.11.0"
name = "fullauto"
game_root = "game"
hook_sources = ["src"]

[entrypoint]
file_path = "game/default.xex"
out_directory_path = "generated/default"
includes = []

# CRT setjmp/longjmp, found by their register save/restore pattern (10 call sites use setjmp).
setjmp_address = 0x82580690
longjmp_address = 0x82580330

# Functions that analysis cannot find on its own go here, e.g.
# [entrypoint.functions]
# 0x82001234 = {}
# 0x82004321 = { size = 0x240 }

# Jump tables that analysis sizes wrong go here. Each needs the address of the bctr, the index
# register and every target, read from the table in the XEX.
#
# Track loader (sub_8230E1A8): a switch on a byte with no range check before it, so analysis
# kept only the first of its 8 entries and the game stopped when a race started loading.
[[switch_tables]]
address = 0x8230E43C
register = 4
labels = [0x8230E460, 0x8230E49C, 0x8230E500, 0x8230E648, 0x8230EA4C, 0x8230ECB4, 0x8230EE28, 0x8230EE48]
